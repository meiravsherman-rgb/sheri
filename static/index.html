<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שרי הבוטית - סימולטור</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b141a;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2a3942;
        }
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #00a884;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: white;
        }
        .header-info h2 { color: #e9edef; font-size: 16px; font-weight: 500; }
        .header-info p { color: #8696a0; font-size: 13px; }

        /* User setup bar */
        .user-bar {
            background: #182229;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #2a3942;
        }
        .user-bar label { color: #8696a0; font-size: 13px; }
        .user-bar input {
            background: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            color: #e9edef;
            font-size: 13px;
            width: 120px;
        }
        .user-bar button {
            background: #00a884;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
        }
        .user-bar button:hover { background: #00c49a; }

        /* Chat area */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 60px;
            background: #0b141a url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='p' width='40' height='40' patternUnits='userSpaceOnUse'%3E%3Cpath d='M0 20h40M20 0v40' stroke='%23111b21' stroke-width='0.5'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='400' height='400' fill='url(%23p)'/%3E%3C/svg%3E");
        }
        .message {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            position: relative;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            background: #005c4b;
            color: #e9edef;
            margin-left: auto;
            margin-right: 0;
            border-top-left-radius: 8px;
            border-top-right-radius: 0;
        }
        .message.bot {
            background: #202c33;
            color: #e9edef;
            margin-right: auto;
            margin-left: 0;
            border-top-right-radius: 8px;
            border-top-left-radius: 0;
        }
        .message .time {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            float: left;
            margin-top: 4px;
            margin-right: 8px;
        }
        .typing {
            background: #202c33;
            color: #8696a0;
            padding: 8px 16px;
            border-radius: 8px;
            margin-right: auto;
            font-size: 14px;
            display: none;
            max-width: 200px;
        }
        .typing.show { display: block; }
        .typing span {
            animation: dots 1.5s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.3s; }
        .typing span:nth-child(3) { animation-delay: 0.6s; }
        @keyframes dots {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
        .day-divider {
            text-align: center;
            margin: 16px 0;
        }
        .day-divider span {
            background: #182229;
            color: #8696a0;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* Input area */
        .input-area {
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            background: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e9edef;
            font-size: 15px;
            outline: none;
        }
        .input-area input::placeholder { color: #8696a0; }
        .send-btn {
            background: #00a884;
            border: none;
            border-radius: 50%;
            width: 42px; height: 42px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn:hover { background: #00c49a; }
        .send-btn:disabled { background: #2a3942; cursor: not-allowed; }
        .send-btn svg { fill: #e9edef; width: 20px; height: 20px; }

        /* Buttons */
        .buttons-container {
            max-width: 65%;
            margin-right: auto;
            margin-left: 0;
            margin-bottom: 4px;
        }
        .buttons-container .buttons-header {
            background: #202c33;
            color: #e9edef;
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            border-top-right-radius: 8px;
            border-top-left-radius: 0;
            font-size: 14px;
            line-height: 1.5;
        }
        .buttons-container .btn-option {
            display: block;
            width: 100%;
            background: #202c33;
            color: #00a884;
            border: none;
            border-top: 1px solid #2a3942;
            padding: 10px 12px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: background 0.2s;
        }
        .buttons-container .btn-option:last-child {
            border-radius: 0 0 8px 8px;
        }
        .buttons-container .btn-option:hover {
            background: #2a3942;
        }
        .buttons-container.disabled .btn-option {
            color: #8696a0;
            cursor: default;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .chat { padding: 10px 12px; }
            .message { max-width: 85%; }
            .buttons-container { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar">🌸</div>
        <div class="header-info">
            <h2>שרי הבוטית</h2>
            <p>שיטת שרמן - בריאות נשית טבעית</p>
        </div>
    </div>

    <div class="user-bar">
        <label>שם:</label>
        <input type="text" id="userName" value="טלי" placeholder="השם שלך">
        <label>טלפון:</label>
        <input type="text" id="userPhone" value="972501234567" placeholder="972...">
        <button onclick="resetChat()">שיחה חדשה</button>
    </div>

    <div class="chat" id="chat">
        <div class="day-divider"><span>היום</span></div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="כתבי הודעה..." autofocus>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.239 1.816-13.239 1.818-.011 7.911z"/></svg>
        </button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function getTime() {
            return new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(text, type) {
            // Remove typing indicator if present
            const typing = document.querySelector('.typing');
            if (typing) typing.remove();

            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `${escapeHtml(text)}<span class="time">${getTime()}</span>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            let escaped = div.innerHTML;
            // Convert **bold** to <b>
            escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
            // Convert newlines
            escaped = escaped.replace(/\n/g, '<br>');
            return escaped;
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'typing show';
            typing.innerHTML = '<span>.</span><span>.</span><span>.</span> שרי מקלידה';
            chat.appendChild(typing);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            const name = document.getElementById('userName').value.trim() || 'User';
            const phone = document.getElementById('userPhone').value.trim() || '972501234567';

            addMessage(text, 'user');
            msgInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, name, message: text })
                });

                const data = await resp.json();
                addMessage(data.reply || 'שגיאה בקבלת תשובה', 'bot');

                // Show buttons if returned
                if (data.buttons) {
                    addButtons(data.buttons.text, data.buttons.options);
                }
            } catch (err) {
                addMessage('שגיאה בחיבור לשרת: ' + err.message, 'bot');
            }

            sendBtn.disabled = false;
            msgInput.focus();
        }

        // Button-to-message mapping (mirrors BUTTON_TO_MESSAGE in main.py)
        const BUTTON_MESSAGES = {
            'btn_courses': 'אשמח לשמוע על הקורסים והמחירים',
            'btn_method': 'ספרי לי מה זו שיטת שרמן',
            'btn_talk': 'אני רוצה לדבר עם מירב',
        };

        function addButtons(headerText, buttons) {
            const typing = document.querySelector('.typing');
            if (typing) typing.remove();

            const container = document.createElement('div');
            container.className = 'buttons-container';

            let html = `<div class="buttons-header">${escapeHtml(headerText)}</div>`;
            for (const btn of buttons) {
                html += `<button class="btn-option" data-id="${btn.id}" onclick="clickButton(this, '${btn.id}')">${escapeHtml(btn.title)}</button>`;
            }
            container.innerHTML = html;
            chat.appendChild(container);
            chat.scrollTop = chat.scrollHeight;
        }

        async function clickButton(el, btnId) {
            // Disable all buttons in this container
            const container = el.closest('.buttons-container');
            container.classList.add('disabled');

            // Show clicked button as a user message
            const text = BUTTON_MESSAGES[btnId] || el.textContent;
            const name = document.getElementById('userName').value.trim() || 'User';
            const phone = document.getElementById('userPhone').value.trim() || '972501234567';

            addMessage(el.textContent, 'user');
            sendBtn.disabled = true;
            showTyping();

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, name, message: text })
                });
                const data = await resp.json();
                addMessage(data.reply || 'שגיאה בקבלת תשובה', 'bot');
                if (data.buttons) {
                    addButtons(data.buttons.text, data.buttons.options);
                }
            } catch (err) {
                addMessage('שגיאה בחיבור לשרת: ' + err.message, 'bot');
            }

            sendBtn.disabled = false;
            msgInput.focus();
        }

        async function resetChat() {
            const phone = document.getElementById('userPhone').value.trim() || '972501234567';

            try {
                await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
            } catch (e) {}

            // Clear chat UI
            chat.innerHTML = '<div class="day-divider"><span>היום</span></div>';

            // Change phone to simulate new user
            const rand = Math.floor(Math.random() * 9000000) + 1000000;
            document.getElementById('userPhone').value = `972${rand}`;
            msgInput.focus();
        }
    </script>
</body>
</html>
