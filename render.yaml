services:
  - type: web
    name: sheri-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
    disk:
      name: sheri-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
